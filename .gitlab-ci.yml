stages:
  - test
  - publish

# Branch pipelines run lint; tag pipelines (vX.Y.Z) additionally
# publish the chart. MR pipelines are skipped when a branch pipeline already
# covers the same commit.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  CHART_DIR: charts/litellm

lint:
  stage: test
  image: alpine/helm:4.2.3
  script:
    - helm lint "$CHART_DIR" -f tests/e2e/values-e2e.yaml

# Publishes oci://oci.git.f6n.io/amit/litellm-sa-auth/litellm:<X.Y.Z> for
# tag vX.Y.Z. The project is public, so pulls need no credentials. The E2E
# suite isn't run here: kind needs a privileged Docker daemon and the shared
# Kubernetes runner is unprivileged -- run `make e2e` locally before tagging.
publish:
  stage: publish
  image: alpine/helm:4.2.3
  needs: [lint]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "$CI_REGISTRY_PASSWORD" | helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - helm package "$CHART_DIR" --version "$VERSION" -d dist
    - helm push "dist/litellm-${VERSION}.tgz" "oci://${CI_REGISTRY_IMAGE}"
